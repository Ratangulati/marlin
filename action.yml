name: 'Marlin'
description: 'AI pull request reviewer powered by Google Gemini'
author: 'Ratan Gulati'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  gemini_api_key:
    description: 'Gemini API key for AI reviews'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm ci

    - name: Build action
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm run build

    - name: Run Marlin
      shell: bash
      env:
        INPUT_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cd ${{ github.action_path }}
        node dist/index.js
