name: Marlin AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Marlin
        uses: ./
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
